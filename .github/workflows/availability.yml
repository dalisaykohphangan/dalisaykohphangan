name: Sync availability from Beds24

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Beds24 calendars
        run: python3 tools/sync_availability.py

      - name: Commit if the booked dates changed
        run: |
          if git diff --quiet -- assets/data/availability.json; then
            echo "Availability unchanged"
            exit 0
          fi
          git config user.name "availability-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/availability.json
          git commit -m "Update availability from Beds24"
          git push
